<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Kios Akun — Tarik Tiket Baru</title>

<!-- PWA: manifest wajib ada & bisa diakses supaya Chrome memunculkan opsi Install -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#151923">
<meta name="background-color" content="#151923">

<!-- Android/Chrome icon fallback -->
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">

<!-- iOS: Safari tidak memakai manifest icons, harus pakai tag ini sendiri -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kios Akun">

<!-- Windows tile fallback -->
<meta name="msapplication-TileColor" content="#151923">
<meta name="msapplication-TileImage" content="/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151923;
    --machine:#1F2433;
    --machine-2:#262C3D;
    --paper:#F6EFDD;
    --paper-shadow:#E3D7B8;
    --stamp:#E1553B;
    --teal:#2FA893;
    --teal-deep:#22806F;
    --text-light:#EFEBE0;
    --text-muted:#8791A6;
    --line:#3A4258;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #232A3C 0%, var(--ink) 55%),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 4px);
    min-height:100vh;
    font-family:'Plus Jakarta Sans', sans-serif;
    color:var(--text-light);
    display:flex;
    justify-content:center;
  }
  svg{display:block;}
  .app{
    width:100%;
    max-width:440px;
    min-height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    padding-bottom:104px;
  }

  /* Header */
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:20px 20px 8px;
  }
  .brand{display:flex; flex-direction:column; gap:5px;}
  .brand .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--teal);
    text-transform:uppercase;
  }
  .brand h1{margin:0; font-size:21px; font-weight:800; letter-spacing:-0.01em;}
  .status-row{display:flex; align-items:center; gap:6px; margin-top:2px;}
  .status-dot{width:6px;height:6px;border-radius:50%; background:var(--text-muted); flex:none;}
  .status-dot.ok{background:var(--teal);}
  .status-dot.fail{background:var(--stamp);}
  .status-text{font-size:10.5px; color:var(--text-muted);}
  .icon-btn{
    width:42px;height:42px;border-radius:12px;
    background:var(--machine-2);
    border:1px solid var(--line);
    color:var(--text-light);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex:none;
  }
  .icon-btn svg{width:19px;height:19px;}
  .icon-btn:active{transform:scale(0.94);}

  /* Kiosk / dispenser */
  .kiosk{
    margin:10px 20px 4px;
    background:linear-gradient(180deg, var(--machine) 0%, var(--machine-2) 100%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 18px 26px;
    position:relative;
    overflow:hidden;
  }
  .kiosk::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 26px);
    pointer-events:none;
  }
  .slot-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    color:var(--text-muted);
    text-transform:uppercase;
    text-align:center;
    margin-bottom:10px;
  }
  .slot{
    height:10px;
    border-radius:6px;
    background:#0F1119;
    box-shadow:inset 0 3px 6px rgba(0,0,0,0.6);
    margin:0 auto 18px;
    width:70%;
  }

  .stage{
    min-height:210px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    position:relative;
  }
  .empty-state{
    text-align:center;
    color:var(--text-muted);
    padding:28px 10px 6px;
    font-size:13.5px;
    line-height:1.5;
  }
  .empty-state .icon-wrap{
    display:flex; justify-content:center; margin-bottom:12px; color:#525A6E;
  }
  .empty-state .icon-wrap svg{width:52px; height:52px; stroke-width:1.3;}

  /* Ticket besar (tampilan dispenser) */
  .ticket{
    width:100%;
    background:var(--paper);
    color:#241E12;
    border-radius:10px;
    position:relative;
    box-shadow:0 14px 26px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .ticket.new{animation:dispense .5s cubic-bezier(.2,.9,.25,1);}
  @keyframes dispense{
    from{transform:translateY(-46px) scale(.96); opacity:0;}
    to{transform:translateY(0) scale(1); opacity:1;}
  }
  .ticket-notch{position:absolute; top:64px; width:18px; height:18px; border-radius:50%; background:var(--machine);}
  .ticket-notch.left{left:-9px;}
  .ticket-notch.right{right:-9px;}
  .ticket-top{
    padding:14px 16px 12px 18px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .serial{font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.1em; color:#8a7a52;}
  .top-actions{display:flex; flex-direction:column; align-items:center; gap:7px; flex:none;}
  .icon-ghost{
    width:26px;height:26px;border-radius:8px; border:none; background:rgba(0,0,0,0.06); color:#6b5f3d;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-ghost svg{width:13px;height:13px;}
  .icon-ghost:active{background:rgba(0,0,0,0.14);}
  .stamp{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    color:var(--stamp); border:2px solid var(--stamp); border-radius:50%;
    width:50px;height:50px; transform:rotate(-14deg); opacity:.85;
  }
  .stamp svg{width:15px;height:15px;}
  .stamp span{font-size:7.5px; font-weight:800; letter-spacing:.08em; font-family:'JetBrains Mono', monospace;}
  .perforation{height:0; border-top:2px dashed var(--paper-shadow); margin:0 18px;}
  .ticket-body{padding:14px 18px 18px; display:flex; flex-direction:column; gap:12px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field-label{
    display:flex; align-items:center; gap:6px;
    font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#8a7a52; font-weight:700;
  }
  .field-label svg{width:13px;height:13px;}
  .field-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:rgba(0,0,0,0.04); border-radius:8px; padding:9px 10px;
  }
  .field-row span.val{font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:600; word-break:break-all;}
  .copy-btn{
    flex:none; display:flex; align-items:center; gap:5px;
    background:#241E12; color:var(--paper); border:none; border-radius:6px;
    font-size:11px; font-weight:700; padding:6px 10px; cursor:pointer;
  }
  .copy-btn svg{width:12px;height:12px;}
  .copy-btn:active{transform:scale(.93);}

  /* History */
  .history{padding:24px 20px 0; flex:1;}
  .history h2{
    font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted);
    font-weight:700; margin:0 0 12px;
  }
  .search-wrap{
    display:flex; align-items:center; gap:9px;
    background:var(--machine-2); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-bottom:14px;
  }
  .search-wrap svg{width:16px; height:16px; color:var(--text-muted); flex:none;}
  .search-wrap input{
    flex:1; border:none; background:none; outline:none;
    color:var(--text-light); font-size:13.5px; font-family:'Plus Jakarta Sans', sans-serif;
  }
  .search-wrap input::placeholder{color:var(--text-muted);}
  .search-clear{
    border:none; background:none; color:var(--text-muted); cursor:pointer;
    display:none; align-items:center; justify-content:center; padding:2px;
  }
  .search-clear.show{display:flex;}
  .search-clear svg{width:14px;height:14px;}

  .history-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }
  .empty-history{color:var(--text-muted); font-size:13px; padding:8px 2px 20px;}

  /* Ticket mini (grid riwayat, 2 per baris) */
  .ticket-mini{
    background:var(--paper); color:#241E12; border-radius:10px;
    padding:10px 10px 11px; position:relative; display:flex; flex-direction:column; gap:8px;
    box-shadow:0 6px 14px rgba(0,0,0,0.25);
  }
  .mini-top{display:flex; align-items:center; justify-content:space-between;}
  .mini-serial{font-family:'JetBrains Mono', monospace; font-size:9.5px; color:#8a7a52; letter-spacing:.06em;}
  .mini-del{
    width:20px;height:20px;border-radius:6px; border:none; background:rgba(0,0,0,0.06); color:#6b5f3d;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  }
  .mini-del svg{width:11px;height:11px;}
  .mini-field{display:flex; flex-direction:column; gap:3px;}
  .mini-label{
    display:flex; align-items:center; gap:4px;
    font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; color:#8a7a52; font-weight:700;
  }
  .mini-label svg{width:10px;height:10px;}
  .mini-val{
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700;
    word-break:break-all; line-height:1.3;
    background:rgba(0,0,0,0.04); border-radius:6px; padding:5px 7px;
  }
  .mini-actions{display:flex; gap:6px; margin-top:2px;}
  .mini-copy{
    flex:1; display:flex; align-items:center; justify-content:center;
    background:#241E12; color:var(--paper); border:none; border-radius:6px;
    padding:6px 0; cursor:pointer;
  }
  .mini-copy svg{width:12px;height:12px;}
  .mini-copy:active{transform:scale(.92);}
  .no-results{
    grid-column:1/-1; text-align:center; color:var(--text-muted);
    font-size:13px; padding:24px 10px;
  }

  /* Dispense CTA */
  .cta-wrap{
    position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(21,25,35,0) 0%, var(--ink) 40%);
  }
  .cta-row{width:100%; max-width:400px; display:flex; gap:10px;}
  .cta{
    flex:7 1 0; background:var(--teal); color:#0B221D; border:none; border-radius:16px;
    padding:17px; font-size:15.5px; font-weight:800; letter-spacing:.01em;
    display:flex; align-items:center; justify-content:center; gap:9px;
    box-shadow:0 10px 24px rgba(47,168,147,0.35); cursor:pointer;
  }
  .cta svg{width:19px;height:19px;}
  .cta:active{transform:scale(.98); background:var(--teal-deep); color:var(--paper);}
  .cta.is-busy{opacity:.6; pointer-events:none;}
  .cta-manual{
    flex:3 1 0; background:transparent; color:var(--teal); border:2px solid var(--teal); border-radius:16px;
    padding:15px 6px; font-size:14px; font-weight:800; letter-spacing:.01em;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .cta-manual:active{transform:scale(.98); background:var(--teal); color:#0B221D;}

  /* Manual ticket input */
  .manual-input{
    flex:1; min-width:0; background:transparent; border:none; outline:none;
    font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:600; color:#241E12;
  }
  .manual-input::placeholder{color:#8a7a52; opacity:.7; font-weight:500;}
  .manual-actions{padding:0 18px 18px;}
  .manual-save{
    width:100%; background:#241E12; color:var(--paper); border:none; border-radius:10px;
    padding:12px; font-size:14px; font-weight:800; cursor:pointer;
  }
  .manual-save:active{transform:scale(.98);}
  .manual-save:disabled{opacity:.45; pointer-events:none;}

  /* Sheet / modal */
  .overlay{
    position:fixed; inset:0; background:rgba(10,12,18,0.6);
    display:none; align-items:flex-end; justify-content:center; z-index:20;
  }
  .overlay.show{display:flex;}
  .sheet{
    width:100%; max-width:440px; background:var(--machine-2); border:1px solid var(--line);
    border-radius:20px 20px 0 0; padding:10px 18px calc(20px + env(safe-area-inset-bottom));
    animation:up .25s ease-out;
  }
  @keyframes up{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet .handle{width:36px; height:4px; background:var(--line); border-radius:2px; margin:6px auto 14px;}
  .sheet h3{margin:0 0 4px; font-size:16px;}
  .sheet p.sub{margin:0 0 16px; font-size:12.5px; color:var(--text-muted);}
  .sheet-btn{
    width:100%; text-align:left; background:var(--machine); border:1px solid var(--line); color:var(--text-light);
    border-radius:12px; padding:12px 13px; margin-bottom:10px;
    display:flex; align-items:center; gap:12px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .sheet-btn:active{background:#20263A;}
  .ic-box{width:38px; height:38px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center;}
  .ic-box svg{width:18px;height:18px;}
  .ic-box.teal{background:rgba(47,168,147,0.15); color:var(--teal);}
  .ic-box.stamp{background:rgba(225,85,59,0.15); color:var(--stamp);}
  .ic-box.neutral{background:rgba(239,235,224,0.09); color:var(--text-light);}
  .sheet-btn .txt{display:flex; flex-direction:column;}
  .sheet-btn .desc{font-size:11.5px; font-weight:400; color:var(--text-muted); margin-top:2px;}
  .sheet-close{
    width:100%; text-align:center; background:none; border:none; color:var(--text-muted);
    padding:10px; font-size:13.5px; cursor:pointer;
  }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px);
    background:#0F1119; color:var(--text-light); padding:10px 16px; border-radius:10px; font-size:13px;
    border:1px solid var(--line); border-left:3px solid var(--teal);
    opacity:0; transition:all .25s ease; z-index:40; pointer-events:none; max-width:82%;
  }
  .toast.error{border-left-color:var(--stamp);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  input[type=file]{display:none;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute; top:0; left:0; width:100%; padding:24px; color:#111;}
  }
  #printArea{display:none;}
  #printArea h2{font-family:'Plus Jakarta Sans',sans-serif;}
  #printArea table{width:100%; border-collapse:collapse; font-family:'JetBrains Mono', monospace; font-size:12px;}
  #printArea th, #printArea td{border:1px solid #999; padding:6px 8px; text-align:left;}

  @media (max-width:340px){
    .history-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <span class="eyebrow">Kios Akun</span>
      <h1>Dispenser Tiket</h1>
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Memeriksa penyimpanan…</span>
      </div>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Menu backup"></button>
  </header>

  <div class="kiosk">
    <div class="slot-label">Slot Keluar Tiket</div>
    <div class="slot"></div>
    <div class="stage" id="stage">
      <div class="empty-state" id="emptyState">
        <div class="icon-wrap" id="emptyIcon"></div>
        Belum ada tiket.<br>Tekan tombol di bawah untuk tarik akun pertamamu.
      </div>
    </div>
  </div>

  <div class="history">
    <h2>Riwayat Tiket</h2>
    <div class="search-wrap">
      <span id="searchIcon"></span>
      <input type="text" id="searchInput" placeholder="Cari username...">
      <button class="search-clear" id="searchClear"><span id="clearIcon"></span></button>
    </div>
    <div class="history-grid" id="historyGrid"></div>
    <div class="empty-history" id="emptyHistory">Riwayat masih kosong.</div>
  </div>

</div>

<div class="cta-wrap">
  <div class="cta-row">
    <button class="cta" id="generateBtn"><span id="ctaIcon"></span><span>Tarik Tiket Baru</span></button>
    <button class="cta-manual" id="manualBtn">Manual</button>
  </div>
</div>

<!-- Backup sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="handle"></div>
    <h3>Backup &amp; Data</h3>
    <p class="sub">Amankan data tiket kamu, atau masukkan data lama.</p>
    <button class="sheet-btn" id="backupJsonBtn">
      <span class="ic-box teal" id="icArchive"></span>
      <span class="txt">Backup Data
        <span class="desc">Simpan semua tiket sebagai file .json</span>
      </span>
    </button>
    <button class="sheet-btn" id="backupPdfBtn">
      <span class="ic-box stamp" id="icPrinter"></span>
      <span class="txt">Backup Data PDF
        <span class="desc">Cetak / simpan sebagai PDF</span>
      </span>
    </button>
    <button class="sheet-btn" id="importBtn">
      <span class="ic-box neutral" id="icUpload"></span>
      <span class="txt">Masukkan Data
        <span class="desc">Pulihkan dari file .json hasil backup</span>
      </span>
    </button>
    <button class="sheet-close" id="closeSheet">Tutup</button>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json">
<div class="toast" id="toast"></div>

<div id="printArea">
  <h2>Kios Akun — Backup Tiket</h2>
  <table>
    <thead><tr><th>#</th><th>Username</th><th>Password</th><th>Dibuat</th></tr></thead>
    <tbody id="printBody"></tbody>
  </table>
</div>

<script>
/* ---------- Ikon (SVG line-icon, tanpa emoji) ---------- */
const ICONS = {
  archive: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>`,
  ticket: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8z"/><path d="M13 6.5v2M13 11v2M13 15.5v2"/></svg>`,
  printer: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="1.5"/><path d="M6 17v4h12v-4"/></svg>`,
  upload: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M10 11v6M14 11v6"/></svg>`,
  copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>`,
  user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1-3.5 4-5.5 7-5.5s6 2 7 5.5"/></svg>`,
  key: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="3.2"/><path d="M10.3 12.7 18 5"/><path d="M15 8l2 2M18 5l2 2"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`,

const STORAGE_KEY = "kiosakun:tickets";
let tickets = [];
let isGenerating = false;
let searchQuery = "";
let storageMode = null; // 'cloud' | 'local' | null

/* ---------- Util ---------- */
function toast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'error' ? ' error' : '');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

function setStorageStatus(ok, msg){
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className = 'status-dot ' + (ok ? 'ok' : 'fail');
  text.textContent = msg;
}

function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function makeUsername(existing){
  const available = USERNAMES.filter(u => !existing.has(u));
  if (available.length === 0){
    // semua 200 username sudah kepakai -> fallback tambahin angka
    const base = USERNAMES[Math.floor(Math.random()*USERNAMES.length)];
    const uname = `${base}${Math.floor(Math.random()*90+10)}`;
    return {uname, n: cap(uname.split('.')[0])};
  }
  const uname = available[Math.floor(Math.random()*available.length)];
  return {uname, n: cap(uname.split('.')[0])};
}

function makePassword(n){
  return `${cap(n)}1234#`;
}

/* ---------- Penyimpanan: pilih otomatis antara cloud (preview Claude) atau lokal HP (file mandiri) ---------- */
function waitForCloudStorage(maxWaitMs = 1500){
  return new Promise(resolve=>{
    const start = Date.now();
    (function poll(){
      if (typeof window.storage !== 'undefined'){ resolve(true); return; }
      if (Date.now() - start > maxWaitMs){ resolve(false); return; }
      setTimeout(poll, 150);
    })();
  });
}

function localStorageWorks(){
  try{
    const testKey = '__kiosakun_test__';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    return true;
  }catch(e){
    return false;
  }
}

async function detectStorageMode(){
  const hasCloud = await waitForCloudStorage();
  if (hasCloud){ storageMode = 'cloud'; return; }
  if (localStorageWorks()){ storageMode = 'local'; return; }
  storageMode = null;
}

async function loadTickets(){
  await detectStorageMode();

  if (storageMode === 'cloud'){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      tickets = res && res.value ? JSON.parse(res.value) : [];
      setStorageStatus(true, "Tersimpan otomatis (akun)");
    }catch(e){
      tickets = [];
      setStorageStatus(true, "Tersimpan otomatis (akun)");
    }
    return;
  }

  if (storageMode === 'local'){
    try{
      const raw = window.localStorage.getItem(STORAGE_KEY);
      tickets = raw ? JSON.parse(raw) : [];
      setStorageStatus(true, "Tersimpan di HP ini");
    }catch(e){
      tickets = [];
      setStorageStatus(true, "Tersimpan di HP ini");
    }
    return;
  }

  tickets = [];
  setStorageStatus(false, "Penyimpanan tidak tersedia — pakai Backup Data");
}

async function saveTickets(){
  const payload = JSON.stringify(tickets);

  if (storageMode === 'cloud'){
    for (let attempt = 0; attempt < 3; attempt++){
      try{
        const result = await window.storage.set(STORAGE_KEY, payload, false);
        if (result){
          try{
            const check = await window.storage.get(STORAGE_KEY, false);
            if (check && check.value === payload){
              setStorageStatus(true, "Tersimpan otomatis (akun)");
              return true;
            }
          }catch(e){ /* verifikasi gagal, coba lagi di bawah */ }
        }
      }catch(e){
        console.error('Gagal menyimpan ke cloud (percobaan ' + (attempt+1) + ')', e);
      }
      await new Promise(r => setTimeout(r, 300));
    }
    setStorageStatus(false, "Backup otomatis gagal — cek koneksi");
    return false;
  }

  if (storageMode === 'local'){
    try{
      window.localStorage.setItem(STORAGE_KEY, payload);
      const check = window.localStorage.getItem(STORAGE_KEY);
      if (check === payload){
        setStorageStatus(true, "Tersimpan di HP ini");
        return true;
      }
    }catch(e){
      console.error('Gagal menyimpan ke penyimpanan lokal', e);
    }
    setStorageStatus(false, "Gagal menyimpan di HP — pakai Backup Data");
    return false;
  }

  setStorageStatus(false, "Penyimpanan tidak tersedia — pakai Backup Data");
  return false;
}

/* Ambil segmen pertama sebelum titik, kapital huruf pertama, buat password */
function passwordFromUsername(uname){
  const first = uname.split('.')[0].trim();
  if (!first) return '';
  return makePassword(cap(first));
}

function startManualTicket(){
  const stage = document.getElementById('stage');
  stage.innerHTML = manualTicketMarkup();

  const input = document.getElementById('manualUsernameInput');
  const preview = document.getElementById('manualPasswordPreview');
  const saveBtn = document.getElementById('manualSaveBtn');
  const cancelBtn = document.getElementById('manualCancelBtn');

  input.addEventListener('input', ()=>{
    const uname = input.value.trim().toLowerCase();
    const pw = passwordFromUsername(uname);
    preview.textContent = pw || '—';
    saveBtn.disabled = !uname;
  });

  saveBtn.addEventListener('click', async ()=>{
    const uname = input.value.trim().toLowerCase();
    if (!uname) return;
    const existing = new Set(tickets.map(t=>t.username));
    if (existing.has(uname)){
      toast('Username sudah ada, pakai yang lain', 'error');
      return;
    }
    const password = passwordFromUsername(uname);
    const serial = tickets.length ? Math.max(...tickets.map(t=>t.serial)) + 1 : 1;
    const ticket = {
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
      serial,
      username: uname,
      password,
      createdAt: new Date().toISOString()
    };

    tickets.push(ticket);
    renderStage(ticket);
    renderHistory();

    const ok = await saveTickets();
    toast(ok ? 'Tiket manual disimpan' : 'Tersimpan di layar, backup otomatis gagal', ok ? 'success' : 'error');
  });

  cancelBtn.addEventListener('click', ()=>{
    const sorted = [...tickets].sort((a,b)=> b.serial - a.serial);
    renderStage(sorted[0] || null);
  });

  input.focus();
}

/* ---------- Render tiket mini (grid riwayat, 2 per baris) ---------- */
function ticketMiniMarkup(t){
  return `
    <div class="ticket-mini" data-id="${t.id}">
      <div class="mini-top">
        <span class="mini-serial">#${String(t.serial).padStart(4,'0')}</span>
        <button class="mini-del" data-id="${t.id}" title="Hapus tiket">${ICONS.trash}</button>
      </div>
      <div class="mini-field">
        <div class="mini-label">${ICONS.user}Username</div>
        <div class="mini-val">${t.username}</div>
      </div>
      <div class="mini-field">
        <div class="mini-label">${ICONS.key}Password</div>
        <div class="mini-val">${t.password}</div>
      </div>
      <div class="mini-actions">
        <button class="mini-copy" data-copy="${t.username}" title="Salin username">${ICONS.copy}</button>
        <button class="mini-copy" data-copy="${t.password}" title="Salin password">${ICONS.copy}</button>
      </div>
    </div>
  `;
}

function wireTicketEvents(container){
  container.querySelectorAll('.copy-btn, .mini-copy').forEach(b=>{
    b.addEventListener('click', ()=>copyText(b.dataset.copy));
  });
  container.querySelectorAll('.del-btn, .mini-del').forEach(b=>{
    b.addEventListener('click', ()=>deleteTicket(b.dataset.id));
  });
}

function renderStage(latest){
  const stage = document.getElementById('stage');
  if (!latest){
    stage.innerHTML = `
      <div class="empty-state">
        <div class="icon-wrap">${ICONS.ticket}</div>
        Belum ada tiket.<br>Tekan tombol di bawah untuk tarik akun pertamamu.
      </div>`;
    return;
  }
  stage.innerHTML = ticketMarkup(latest, {isNew:true});
  wireTicketEvents(stage);
}

function renderHistory(){
  const grid = document.getElementById('historyGrid');
  const emptyH = document.getElementById('emptyHistory');
  const sorted = [...tickets].sort((a,b)=> b.serial - a.serial);

  if (sorted.length === 0){
    grid.innerHTML = '';
    emptyH.style.display = 'block';
    return;
  }
  emptyH.style.display = 'none';

  const q = searchQuery.trim().toLowerCase();
  const filtered = q ? sorted.filter(t => t.username.toLowerCase().includes(q)) : sorted;

  if (filtered.length === 0){
    grid.innerHTML = `<div class="no-results">Tidak ada tiket dengan username itu.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(t => ticketMiniMarkup(t)).join('');
  wireTicketEvents(grid);
}

function copyText(text){
  navigator.clipboard?.writeText(text).then(()=>toast("Disalin")).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast("Disalin");
  });
}

async function deleteTicket(id){
  const before = tickets.length;
  tickets = tickets.filter(t=>t.id !== id);
  if (tickets.length === before) return;

  const sorted = [...tickets].sort((a,b)=> b.serial - a.serial);
  renderStage(sorted[0] || null);
  renderHistory();

  const ok = await saveTickets();
  toast(ok ? "Tiket dihapus" : "Terhapus di layar, backup otomatis gagal", ok ? 'success' : 'error');
}

/* ---------- Generate (optimistic UI: tiket selalu tampil dulu, baru disimpan) ---------- */
async function generateTicket(){
  if (isGenerating) return;
  isGenerating = true;
  const btn = document.getElementById('generateBtn');
  btn.classList.add('is-busy');

  try{
    const existing = new Set(tickets.map(t=>t.username));
    const {uname, n} = makeUsername(existing);
    const password = makePassword(n);
    const serial = tickets.length ? Math.max(...tickets.map(t=>t.serial)) + 1 : 1;
    const ticket = {
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
      serial,
      username: uname,
      password,
      createdAt: new Date().toISOString()
    };

    tickets.push(ticket);
    renderStage(ticket);
    renderHistory();

    const ok = await saveTickets();
    if (!ok){
      toast("Tiket tampil, tapi backup otomatis gagal. Coba tarik lagi atau backup manual.", 'error');
    }
  }catch(err){
    console.error(err);
    toast("Terjadi kesalahan, coba lagi", 'error');
  }finally{
    isGenerating = false;
    btn.classList.remove('is-busy');
  }
}

/* ---------- Backup JSON ---------- */
function backupJson(){
  if (tickets.length === 0){ toast("Belum ada data untuk dibackup", 'error'); return; }
  const blob = new Blob([JSON.stringify(tickets, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kios-akun-backup-${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast("Backup JSON diunduh");
}

/* ---------- Backup PDF (cetak) ---------- */
function backupPdf(){
  if (tickets.length === 0){ toast("Belum ada data untuk dibackup", 'error'); return; }
  const body = document.getElementById('printBody');
  const sorted = [...tickets].sort((a,b)=>a.serial-b.serial);
  body.innerHTML = sorted.map(t=>`
    <tr>
      <td>${String(t.serial).padStart(4,'0')}</td>
      <td>${t.username}</td>
      <td>${t.password}</td>
      <td>${new Date(t.createdAt).toLocaleString('id-ID')}</td>
    </tr>
  `).join('');
  window.print();
}

/* ---------- Import ---------- */
function importFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('format salah');
      const existing = new Set(tickets.map(t=>t.username));
      let added = 0;
      let nextSerial = tickets.length ? Math.max(...tickets.map(t=>t.serial)) + 1 : 1;
      data.forEach(item=>{
        if (item && item.username && item.password && !existing.has(item.username)){
          tickets.push({
            id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()+added)),
            serial: item.serial || nextSerial++,
            username: item.username,
            password: item.password,
            createdAt: item.createdAt || new Date().toISOString()
          });
          existing.add(item.username);
          added++;
        }
      });
      const sorted = [...tickets].sort((a,b)=> b.serial - a.serial);
      renderStage(sorted[0] || null);
      renderHistory();
      const ok = await saveTickets();
      toast(added > 0 ? `${added} tiket dimasukkan` : "Tidak ada data baru", (ok || added===0) ? 'success' : 'error');
    }catch(err){
      toast("File tidak valid", 'error');
    }
  };
  reader.readAsText(file);
}

/* ---------- Wire up UI ---------- */
document.getElementById('generateBtn').addEventListener('click', generateTicket);
document.getElementById('manualBtn').addEventListener('click', startManualTicket);

const overlay = document.getElementById('overlay');
document.getElementById('menuBtn').addEventListener('click', ()=>overlay.classList.add('show'));
document.getElementById('closeSheet').addEventListener('click', ()=>overlay.classList.remove('show'));
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('show'); });

document.getElementById('backupJsonBtn').addEventListener('click', ()=>{ backupJson(); overlay.classList.remove('show'); });
document.getElementById('backupPdfBtn').addEventListener('click', ()=>{ backupPdf(); overlay.classList.remove('show'); });
document.getElementById('importBtn').addEventListener('click', ()=>{ document.getElementById('fileInput').click(); });
document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if (file) importFile(file);
  e.target.value = '';
  overlay.classList.remove('show');
});

const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
searchInput.addEventListener('input', (e)=>{
  searchQuery = e.target.value;
  searchClear.classList.toggle('show', searchQuery.length > 0);
  renderHistory();
});
searchClear.addEventListener('click', ()=>{
  searchQuery = "";
  searchInput.value = "";
  searchClear.classList.remove('show');
  renderHistory();
});

/* ---------- Init ---------- */
(async function init(){
  await loadTickets();
  const sorted = [...tickets].sort((a,b)=> b.serial - a.serial);
  renderStage(sorted[0] || null);
  renderHistory();
})();
